<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery — Art Studio 184</title>
  <meta name="description" content="Explore 190 Art Studio 184 projects: characters and sculptures, photo zones and installations, branded displays and oversized promotional objects.">
  <meta name="theme-color" content="#050505">
  <link rel="canonical" href="https://optidigitalagent.github.io/porfolio/gallery.html">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/site.js" defer></script><script src="assets/js/gallery.js" defer></script>
</head>
<body data-page="gallery">
<div id="site-header"></div>
<main id="main-content">
  <header class="gallery-hero"><div class="container page-hero-grid reveal"><div><p class="eyebrow">Portfolio archive</p><h1 class="h1">Work built<br>to be experienced.</h1></div><p class="lead">A living archive of sculptures, installations, photo zones and branded objects produced by Art Studio 184.</p></div></header>
  <div class="gallery-toolbar"><div class="container"><div class="gallery-filters" data-gallery-filters aria-label="Gallery filters"></div></div></div>
  <div class="gallery-status" data-gallery-status><div>Loading 190 works…</div></div>
  <div data-gallery-host></div>
  <section class="cta-band"><div class="container"><p class="eyebrow" style="color:#064f4a">Seen something close to your task?</p><h2 class="h2">Use it as a reference. We will create your own solution.</h2><a class="btn" href="contact.html">Discuss a project</a></div></section>
</main>
<div id="site-footer"></div>
<div class="lightbox" data-lightbox aria-hidden="true" role="dialog" aria-modal="true" aria-label="Project image viewer">
  <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close image">×</button>
  <button class="lightbox-nav lightbox-prev" type="button" data-lightbox-prev aria-label="Previous image">←</button>
  <img class="lightbox-image" data-lightbox-image src="" alt="">
  <button class="lightbox-nav lightbox-next" type="button" data-lightbox-next aria-label="Next image">→</button>
  <div class="lightbox-caption" data-lightbox-caption></div>
</div>
</body>
</html>
